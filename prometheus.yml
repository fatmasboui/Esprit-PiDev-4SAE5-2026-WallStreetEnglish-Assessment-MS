global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: 
        - 'assessment-service:8088'
        - 'quiz-service:8085'
        - 'career-service:8082'
        - 'certification-service:8080'
